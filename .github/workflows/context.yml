name: Secrets

on: workflow_dispatch

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the secret is present (without printing it)
        run: |
          if [ -z "${{ secrets.MY_API_KEY }}" ]; then
            echo "❌ Secret MY_API_KEY is not set. Add it in repo settings."
            exit 1
          fi
          echo "✅ Secret is available. Length is characters."
          echo "Even if I try to print it, GitHub masks it: ${{ secrets.MY_API_KEY }}"



      - name: Confirm the variable is present
        run: |
          if [ -z "${{ vars.YOUTUBE }}" ]; then
            echo "❌ Variable YOUTUBE is not set. Add it in repo settings."
            exit 1
          fi
          echo "✅ Variable is available. Length is characters."
          echo "Even if I try to print it, since it is a variable GitHub prints it: ${{ vars.YOUTUBE }}"
